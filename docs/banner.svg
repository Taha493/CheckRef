<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">CiteSure</title>
  <desc id="d">CiteSure checks thesis references and in-text citations against the APA 6th Edition guidelines prescribed by UVAS.</desc>
  <style>
    .sans { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    .serif { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; }
    .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; }
    .check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 1s .3s ease forwards; }
    .fade1 { opacity: 0; animation: up .8s .5s ease forwards; }
    .fade2 { opacity: 0; animation: up .8s .8s ease forwards; }
    .fade3 { opacity: 0; animation: up .8s 1.1s ease forwards; }
    .card { opacity: 0; animation: up .9s .6s ease forwards; }
    /* the reference card: a 9-second loop (strike → problem → corrected) */
    .bad { text-decoration: line-through; text-decoration-color: rgba(193, 60, 59, 0); animation: bad 9s 1.4s infinite; }
    .badge { opacity: 0; animation: badge 9s 1.4s infinite; }
    .fixed { opacity: 0; animation: fixed 9s 1.4s infinite; }
    .scan { animation: scan 9s 1.4s infinite; opacity: 0; }
    .dot { animation: pulse 1.8s ease-in-out infinite; transform-origin: 66px 268px; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes bad { 0%, 12% { fill: #1c1f25; text-decoration-color: rgba(193, 60, 59, 0); }
                     22%, 88% { fill: #b02a2d; text-decoration-color: #c13c3b; }
                     96%, 100% { fill: #1c1f25; text-decoration-color: rgba(193, 60, 59, 0); } }
    @keyframes badge { 0%, 20% { opacity: 0; } 28%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes fixed { 0%, 40% { opacity: 0; } 50%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes scan { 0% { opacity: 0; transform: translateY(0); } 4% { opacity: .9; } 18% { opacity: .9; transform: translateY(150px); } 22%, 100% { opacity: 0; transform: translateY(150px); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .check { stroke-dashoffset: 0; }
      .bad { fill: #b02a2d; text-decoration-color: #c13c3b; }
      .fade1, .fade2, .fade3, .card, .badge, .fixed { opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="328" rx="18" fill="#f6f7f8" stroke="#e3e5e7"/>
  <rect x="1" y="1" width="1198" height="5" rx="2" fill="#2855ad"/>

  <!-- left: brand -->
  <rect x="48" y="58" width="56" height="56" rx="12" fill="#2855ad"/>
  <path class="check" d="M62 87l10 10 20-23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="102" class="sans fade1" font-size="44" font-weight="600" fill="#1c1f25" letter-spacing="-1">CiteSure</text>
  <text x="50" y="160" class="sans fade2" font-size="13" font-weight="600" fill="#2855ad" letter-spacing="2">APA 6TH EDITION · UVAS</text>
  <text class="sans fade2" font-size="22" fill="#2a2e34">
    <tspan x="48" y="196">Validates thesis references and in-text</tspan>
    <tspan x="48" y="226">citations against the APA 6th Edition</tspan>
    <tspan x="48" y="256">guidelines prescribed by UVAS.</tspan>
  </text>
  <g class="fade3">
    <circle class="dot" cx="66" cy="292" r="5" fill="#2c965d"/>
    <text x="80" y="297" class="mono" font-size="14" fill="#5f636a">live · citesure.duckdns.org</text>
  </g>

  <!-- right: a reference being checked -->
  <g class="card">
    <rect x="560" y="44" width="592" height="244" rx="12" fill="#fff" stroke="#e3e5e7"/>
    <rect x="560" y="44" width="592" height="40" rx="12" fill="#f9fafb"/>
    <rect x="560" y="72" width="592" height="12" fill="#f9fafb"/>
    <line x1="560" y1="84" x2="1152" y2="84" stroke="#e3e5e7"/>
    <text x="582" y="69" class="mono" font-size="13" fill="#5f636a">#1</text>
    <text x="610" y="69" class="sans" font-size="15" font-weight="600" fill="#1c1f25">Ahmed &amp; Khan (2019)</text>
    <text x="790" y="69" class="sans" font-size="12.5" fill="#5f636a">Journal article</text>

    <g class="badge">
      <rect x="1004" y="56" width="52" height="20" rx="4" fill="#ffedeb"/>
      <text x="1030" y="70" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#b02a2d">2 errors</text>
      <rect x="1062" y="56" width="74" height="20" rx="4" fill="#e5efff"/>
      <text x="1099" y="70" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#224fa7">Corrected</text>
    </g>

    <text x="582" y="112" class="sans" font-size="11" font-weight="600" fill="#5f636a" letter-spacing="1.2">AS WRITTEN</text>
    <text class="serif" font-size="16" fill="#1c1f25">
      <tspan x="582" y="138">Ahmed, S., &amp; Khan, M. (2019). Effect <tspan class="bad">Of Probiotics On Broiler</tspan></tspan>
      <tspan x="582" y="160"><tspan class="bad">Growth Performance</tspan>. <tspan font-style="italic">Poultry Science, 98</tspan>(4), 1650–1658. <tspan class="bad">doi:</tspan>10.3382/…</tspan>
    </text>
    <rect class="scan" x="566" y="96" width="580" height="2" fill="#2855ad"/>

    <g class="badge">
      <rect x="582" y="176" width="44" height="20" rx="4" fill="#ffedeb"/>
      <text x="604" y="190" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#b02a2d">Error</text>
      <text x="634" y="190" class="mono" font-size="12" fill="#51555c">REF-TITLE-01</text>
      <text x="736" y="190" class="sans" font-size="13" fill="#373b41">Titles in sentence case</text>
      <text x="904" y="190" class="mono" font-size="12" fill="#51555c">REF-DOI-01</text>
      <text x="992" y="190" class="sans" font-size="13" fill="#373b41">https://doi.org/…</text>
    </g>

    <g class="fixed">
      <text x="582" y="222" class="sans" font-size="11" font-weight="600" fill="#5f636a" letter-spacing="1.2">CORRECTED ENTRY</text>
      <rect x="578" y="230" width="558" height="46" rx="6" fill="#f6f9f7" stroke="#dbe9df"/>
      <text class="serif" font-size="14.5" fill="#1c1f25">
        <tspan x="590" y="249">Ahmed, S., &amp; Khan, M. (2019). Effect of probiotics on broiler growth</tspan>
        <tspan x="590" y="268">performance. <tspan font-style="italic">Poultry Science, 98</tspan>(4), 1650–1658. https://doi.org/10.3382/…</tspan>
      </text>
    </g>
  </g>
</svg>
